name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A force-push (restacking a PR stack rewrites every branch above the edit)
# otherwise leaves the superseded push's runs burning beside the new ones.
# For pull_request events the ref is per-PR, so each stack level cancels only
# its own stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `--all-features` includes `bundled`, so this matrix builds the vendored
  # SQLite amalgamation everywhere, which is also the only way Windows can
  # build at all (it has no system SQLite).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `geopackage-py` is a cdylib for Python to load; its tests are pytest,
      # in the `python` job below, against the module maturin builds.
      - run: cargo test --workspace --all-features --exclude geopackage-py

  # The library's default build links the system SQLite, so it needs its own
  # leg: the bundled matrix above never exercises the linked path, the
  # ENABLE_RTREE check, or Apple's defensive-mode and persist-WAL divergences
  # (macOS ships a hardened SQLite build, which is exactly what makes this leg
  # valuable). `geopackage-cli` defaults to `bundled`, and feature unification
  # would spread that through a plain `--workspace` build, so the CLI is
  # excluded here and tested system-linked in a second step.
  test-system-sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The linker needs the unversioned libsqlite3.so, which only the dev
      # package provides; installed explicitly rather than trusted to the
      # runner image. macOS links the SDK's libsqlite3.tbd with no extra step.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude geopackage-cli --exclude geopackage-py
      - run: cargo test -p geopackage-cli --no-default-features

  # The Python bindings: the abi3 module maturin builds, under pytest, on a
  # current CPython everywhere, and on the oldest the abi3 floor promises.
  # The floor runs on Linux only, and on 24.04: actions/python-versions
  # publishes no 3.9 builds for Windows, for macOS on arm64 (which
  # macos-latest is), or for Ubuntu 26.04 (which ubuntu-latest now is).
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin pytest
      - run: maturin build -m geopackage-py/Cargo.toml -o dist
      - run: python -m pip install --no-index --find-links dist geopackage-rs
      - run: python -m pytest geopackage-py/tests

  # The QGIS plugin, under headless QGIS from the distribution's packages
  # (3.34 on Ubuntu 24.04), with the system Python QGIS is built against.
  qgis-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-qgis qgis-providers python3-venv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          /usr/bin/python3 -m venv --system-site-packages venv
          venv/bin/pip install maturin pytest
          venv/bin/maturin build -m geopackage-py/Cargo.toml -o dist
          venv/bin/pip install --no-index --find-links dist geopackage-rs
      - run: venv/bin/python -m pytest qgis-plugin/tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: venv/bin/python scripts/package_qgis_plugin.py dist/*.whl

  # The native provider builds against QGIS 4 only, which no Ubuntu release
  # packages yet, so this job takes QGIS 4.2 from conda-forge, on each OS. It
  # builds the provider and runs the plugin's tests, the provider tests
  # against both the Python and the native provider.
  native-provider:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            library: libgeopackage_qgis.so
          - os: macos-latest
            library: libgeopackage_qgis.dylib
          - os: windows-latest
            library: geopackage_qgis.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: qgis
          channels: conda-forge
          conda-remove-defaults: "true"
          python-version: "3.13"
      # On Windows, conda-forge's QGIS 4.2.3 imports a protobuf symbol
      # mangled with abseil's lts_20260526, and the solver otherwise picks a
      # libprotobuf built with a newer abseil, so qgis._core fails to load
      # ("The specified procedure could not be found"). Pin abseil to the
      # version QGIS was built with.
      - run: |
          extra=""
          if [ "$RUNNER_OS" = Windows ]; then extra="libabseil=20260526"; fi
          conda install -y "qgis=4.2" pytest maturin $extra
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            geopackage-qgis -> target
      - run: |
          maturin build -m geopackage-py/Cargo.toml -o dist
          pip install --no-index --find-links dist geopackage-rs
      # QGIS and Qt as conda installs them: under Library on Windows.
      - run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "QT_DIR=$CONDA_PREFIX/Library" >> "$GITHUB_ENV"
          else
            echo "QT_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --manifest-path geopackage-qgis/Cargo.toml --check
      - run: cargo clippy --release --all-targets --manifest-path geopackage-qgis/Cargo.toml -- -D warnings
      - run: cargo build --release --manifest-path geopackage-qgis/Cargo.toml
      - if: runner.os != 'Windows'
        run: |
          export GPKG_TOOLKIT_NATIVE_PROVIDER="$PWD/geopackage-qgis/target/release/${{ matrix.library }}"
          python -X faulthandler -m pytest qgis-plugin/tests -rs
        env:
          QT_QPA_PLATFORM: offscreen
      # On Windows, conda's QGIS is set up for cmd: its bash activation script
      # joins PYTHONPATH with ':', which Windows' Python doesn't split on, and
      # Git Bash's PATH carries mingw builds of DLLs that QGIS's bindings then
      # load in place of conda's. cmd runs the package's .bat activation.
      - if: runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: |
          set "GPKG_TOOLKIT_NATIVE_PROVIDER=%CD%\geopackage-qgis\target\release\${{ matrix.library }}"
          python -c "import qgis.core; print(qgis.core.Qgis.version())" || exit /b 1
          python -X faulthandler -m pytest qgis-plugin/tests -rs
        env:
          QT_QPA_PLATFORM: offscreen
      # Which copies of QGIS's and Qt's DLLs, and of the DLLs they share with
      # other software, a failed Windows run found first on PATH.
      - if: failure() && runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: |
          echo %PATH%
          where qgis_core.dll Qt6Core.dll sqlite3.dll zlib.dll libcrypto-3-x64.dll libssl-3-x64.dll gdal.dll proj_9.dll geos_c.dll
          conda list
          exit /b 0
      # A crash in QGIS's or the provider's C++ shows no Python frames, so a
      # failed run on Linux is repeated under gdb for the native backtrace.
      - if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          export GPKG_TOOLKIT_NATIVE_PROVIDER="$PWD/geopackage-qgis/target/release/${{ matrix.library }}"
          gdb -batch -ex run -ex "thread apply all bt 30" --args python -m pytest qgis-plugin/tests -q
        env:
          QT_QPA_PLATFORM: offscreen

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The default feature set compiles different code (no `arrow`), so it
      # gets its own pass; a lint clean under `--all-features` says nothing
      # about items that are only dead without them. The CLI's `bundled`
      # default makes this a bundled build; linkage does not change what
      # clippy sees of this workspace's code.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
      # The book's Rust blocks are compiled by `cargo test --doc` through
      # geopackage/src/book.rs; this step checks the book itself: SUMMARY
      # completeness and internal links.
      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
      - run: mdbook build docs/book

  fuzz-build:
    # Top-of-stack only; see c-abi.
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: geopackage-core/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
        working-directory: geopackage-core

  # The C ABI: header, packaging, and a C consumer that actually links.
  #
  # Separate from `test` because it needs cbindgen and cargo-c, which the rest
  # of the workspace does not. `GPKG_FFI_REQUIRE_C_TESTS` turns the tests'
  # skip-if-missing behaviour into a failure, so a missing tool here is a red
  # build rather than a gate that quietly stopped running.
  # Like the other slow jobs below, gated to the top of a PR stack: an atomic
  # stack merge lands exactly the top PR's tree, so runs on the intermediate
  # trees verify states that never reach main. Null-first so ordinary PRs,
  # pushes to main, and repos without stack metadata run everything. The fast
  # jobs above stay ungated at every level; they are what localises a failure
  # to its commit.
  c-abi:
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GPKG_FFI_REQUIRE_C_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cbindgen --locked
      # The cache restores ~/.cargo/bin. A cargo-c built on an older runner
      # image can link a library the current image lacks, and `cargo install`
      # skips a binary that is present, so reinstall one that cannot start.
      - run: cargo cbuild --version || cargo install cargo-c --locked --force
      # The static library the C smoke tests link against. `cargo test` builds
      # the rlib, not the staticlib, so without this the tests would find
      # nothing to link and fail on the required-flag above. Built with
      # `bundled` throughout this job: the packaged C library is meant to be
      # self-contained, and Windows has no system SQLite to link anyway.
      - run: cargo build -p geopackage-ffi --features bundled
      # The header diff gate and both C programs.
      - run: cargo test -p geopackage-ffi --all-features
      # M3 acceptance criterion 7: the packaged artefacts install and link.
      - run: cargo cbuild -p geopackage-ffi --release --features bundled
      # `--libdir=lib` because cargo-c otherwise follows the platform's own
      # convention, and on Linux that is a multiarch path like
      # lib/x86_64-linux-gnu, which the pkg-config lookup below would miss.
      - run: cargo cinstall -p geopackage-ffi --release --features bundled --prefix=/usr/local --libdir=lib --destdir=${{ runner.temp }}/capi
      - name: Link a C program against the installed package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix="${{ runner.temp }}/capi/usr/local"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cflags=$(pkg-config --define-variable=prefix="$prefix" --cflags geopackage)
          # Link the archive directly, so this checks the static artefact
          # rather than whichever the linker happens to prefer.
          private=$(pkg-config --define-variable=prefix="$prefix" --libs-only-l --libs-only-other --static geopackage | sed 's/-lgeopackage//')
          cc $cflags -std=c11 geopackage-ffi/examples/roundtrip.c "$prefix/lib/libgeopackage.a" $private -o roundtrip
          ./roundtrip geopackage/tests/fixtures/gdal_multilayer_1_4.gpkg points copied.gpkg

  # AddressSanitizer over the one crate with `unsafe` in it.
  #
  # This is what checks the lifetime erasure in `geopackage-ffi/src/handle.rs`:
  # with the close refusal removed, ASan reports a heap-use-after-free, so this
  # job is the thing standing between that design and a silent regression.
  sanitizers:
    # Top-of-stack only; see c-abi.
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -Zsanitizer=address"
      # Leak detection is off for now. SQLite is bundled and keeps one-time
      # allocations alive by design, so LeakSanitizer reports it rather than
      # anything this crate does. Turning it on wants those suppressed first.
      ASAN_OPTIONS: "detect_leaks=0"
      # From cc 1.9.0, cc gives `-fsanitize=address` to the C compiler, so the
      # bundled SQLite is instrumented too. SQLite has two identical static
      # `aiOff` tables, one for FTS3 and one for FTS5. GCC at -O2 merges them,
      # and ASan then registers the one address twice and reports an ODR
      # violation. This flag stops GCC from merging them.
      CFLAGS: "-fno-ipa-icf"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # The target has to be named explicitly for the sanitizer to apply to the
      # test binary rather than only to its dependencies. `bundled` because the
      # leak suppression above is calibrated against the bundled build, and an
      # uninstrumented system library would hide half of what ASan is here for.
      - run: cargo +nightly test -p geopackage-ffi --features bundled --target x86_64-unknown-linux-gnu

  # The recorded public API surface, so a change to what a crate exports shows
  # up as a diff in review rather than only to whoever it breaks later.
  #
  # Its own job because cargo-public-api drives rustdoc's JSON output and
  # rebuilds documentation for every crate, which is far too slow to sit in the
  # ordinary test run. Until 1.0 a diff here is a prompt to confirm the change
  # was meant, not a refusal.
  public-api:
    # Top-of-stack only; see c-abi.
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-public-api --locked
      - run: scripts/public_api.sh --check

  # Miri over the part of the boundary it can reach.
  #
  # Not the whole crate: SQLite is bundled and built from source, and miri
  # cannot call foreign functions, so anything that opens a file stops at
  # `sqlite3_threadsafe`. `tests/boundary.rs` is the carve-out that does not,
  # covering argument validation and string ownership. The rest is the
  # sanitizer's job above; neither tool covers the other's ground.
  miri:
    # Top-of-stack only; see c-abi.
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `bundled` keeps the job independent of the runner image's SQLite; miri
      # never calls into the C library either way.
      - run: cargo +nightly miri test -p geopackage-ffi --features bundled --test boundary
