[package]
name = "geopackage-core"
description = "No-IO core for the OGC GeoPackage format: GeoPackage Binary (GPB) codec, table DDL, RTree trigger definitions, and validation rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The coverage sample decode is behind an off-by-default feature. Without this,
# docs.rs would build the default feature set only, and leave it out.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
hotpath.workspace = true
thiserror.workspace = true
imagesize.workspace = true
jiff.workspace = true
wkb.workspace = true
geo-traits.workspace = true
geo-types = { workspace = true, optional = true }
png = { workspace = true, optional = true }
tiff = { workspace = true, optional = true }

[dev-dependencies]
hegeltest = "0.50.2"
# The sample tests encode their own payloads, so that a decode is checked
# against an encoder other than the one under test. Already optional
# dependencies, so this adds no build cost.
png.workspace = true
tiff.workspace = true

[features]
default = ["geo-types"]
## Convenience conversions to `geo-types` via `GpbGeometry::to_geo`.
geo-types = ["dep:geo-types"]
## Decode the samples of tiled gridded coverage tiles, and the rules that
## need them: values at a position, per-tile statistics, and Requirement 21.
## Off by default: it pulls the `tiff` and `png` decoders, which a caller that
## reads coverages as bytes does not need.
coverage-samples = ["dep:png", "dep:tiff"]
## Activate the hotpath timing instrumentation in this crate. Off by
## default: without it, every hotpath macro is a noop.
hotpath = ["hotpath/hotpath"]
