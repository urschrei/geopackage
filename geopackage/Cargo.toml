[package]
name = "geopackage"
description = "Read and write OGC GeoPackage (.gpkg) files: pure-Rust container handling over bundled SQLite, with spec-correct spatial indexing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
geopackage-core.workspace = true
geo-traits.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[features]
default = ["geo-types"]
## Forward `geopackage-core`'s `geo-types` feature, enabling
## `GpbGeometry::to_geo` conversions. On by default; opt out with
## `default-features = false`.
geo-types = ["geopackage-core/geo-types"]
## Columnar read and write through Apache Arrow, with geometry as a
## GeoArrow WKB column. Off by default: it pulls the `arrow-array` and
## `arrow-schema` crates, which a caller using only the scalar API does not
## need.
arrow = ["dep:arrow-array", "dep:arrow-schema"]

[dev-dependencies]
tempfile.workspace = true
wkb.workspace = true
geo-types.workspace = true
serde_json = "1"
hegeltest = "0.28.2"
criterion = "0.8"

[[bench]]
name = "write"
harness = false

[[bench]]
name = "read"
harness = false
