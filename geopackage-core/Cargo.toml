[package]
name = "geopackage-core"
description = "No-IO core for the OGC GeoPackage format: GeoPackage Binary (GPB) codec, table DDL, RTree trigger definitions, and validation rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
jiff.workspace = true
wkb.workspace = true
geo-traits.workspace = true
geo-types = { workspace = true, optional = true }

[features]
default = ["geo-types"]
## Convenience conversions to `geo-types` via `GpbGeometry::to_geo`.
geo-types = ["dep:geo-types"]
