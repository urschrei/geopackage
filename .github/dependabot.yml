version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # arrow-array and arrow-schema must move together.
      arrow:
        patterns: ["arrow-*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # From 0.28, `hotpath::measure` emits `#[export_name]`, which the
      # workspace's `forbid(unsafe_code)` rejects in the profiling build.
      - dependency-name: hotpath
        versions: [">=0.28"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
