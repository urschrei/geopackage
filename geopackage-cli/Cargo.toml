[package]
name = "geopackage-cli"
description = "Command-line tool for OGC GeoPackage (.gpkg) files: inspect, validate, index and copy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# Documentation is built with `bundled` so the docs.rs host does not need
# SQLite development files.
[package.metadata.docs.rs]
features = ["bundled"]

# The binary is `gpkg`; the crate is `geopackage-cli` so it sits beside
# `geopackage` and `geopackage-core` on crates.io under the same name stem.
[[bin]]
name = "gpkg"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
geopackage.workspace = true
clap.workspace = true
thiserror.workspace = true

[features]
## Forward `geopackage`'s `bundled` feature: compile and statically link the
## vendored SQLite amalgamation instead of linking the system library.
## `cargo install geopackage-cli --features bundled` is the working form on
## hosts with no system SQLite, such as Windows.
bundled = ["geopackage/bundled"]

[dev-dependencies]
tempfile.workspace = true
# Integration tests damage a copy of a fixture through raw SQL to produce the
# conditions `validate` reports; nothing in the binary uses rusqlite directly.
rusqlite.workspace = true
