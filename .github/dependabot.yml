version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # arrow-array and arrow-schema must move together.
      arrow:
        patterns: ["arrow-*"]
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # From 0.26, hotpath exports a symbol per label whose name contains a
      # `"`, which breaks the linker's version script for the geopackage-ffi
      # cdylib when the `hotpath` feature is on. From 0.28, its
      # `#[export_name]` also trips the workspace's `forbid(unsafe_code)`.
      - dependency-name: hotpath
        versions: [">=0.26"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
