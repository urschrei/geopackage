[package]
name = "geopackage-qgis"
description = "A native QGIS vector data provider over the geopackage crate: Rust for the work, a C++ shim for QGIS's class interface"
version = "0.13.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/urschrei/geopackage"
authors = ["The GeoRust developers"]
# Built against a particular QGIS's C++ headers and libraries, so it is
# distributed inside the QGIS plugin, one build per platform and QGIS version,
# never through crates.io.
publish = false

# Not a workspace member, like `geopackage-core/fuzz`: building it needs QGIS's
# development headers, which the workspace's CI legs do not install. It has
# its own lockfile and its own CI job.
[workspace]

[lib]
name = "geopackage_qgis"
# A shared library the QGIS plugin loads with ctypes, then calls
# `geopackage_qgis_register` to register the provider.
crate-type = ["cdylib"]

[dependencies]
arrow-array = "60.1"
arrow-schema = "60"
cxx = "1"

# SQLite: on Linux and macOS, the copy that QGIS loaded, since two copies in
# one process do not see each other's locks (see scripts/host_sqlite.py). On
# Windows, which keeps a lock for each file handle, a copy of its own.
[target.'cfg(not(windows))'.dependencies]
geopackage = { path = "../geopackage", features = ["arrow"] }

[target.'cfg(windows)'.dependencies]
geopackage = { path = "../geopackage", features = ["arrow", "bundled"] }

[build-dependencies]
cxx-build = "1"
# The `cc::Build` that `cxx-build` returns, named in build.rs.
cc = "1"

[profile.release]
lto = "thin"
