[package]
name = "geopackage"
description = "Read and write OGC GeoPackage (.gpkg) files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The `arrow` module is behind an off-by-default feature. Without this, docs.rs
# would build the default feature set only, so the columnar API would be absent
# from the published documentation and the crate root's links into it would
# render as plain text.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
epsg-utils.workspace = true
geopackage-core.workspace = true
geo-traits.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

[features]
default = ["geo-types"]
## Forward `geopackage-core`'s `geo-types` feature, enabling
## `GpbGeometry::to_geo` conversions. On by default; opt out with
## `default-features = false`.
geo-types = ["geopackage-core/geo-types"]
## Columnar read and write through Apache Arrow, with geometry as a
## GeoArrow WKB column. Off by default: it pulls the `arrow-array` and
## `arrow-schema` crates, which a caller using only the scalar API does not
## need.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:serde_json", "dep:sysinfo"]

[dev-dependencies]
tempfile.workspace = true
# The `arrow_bench` example counts rows in a batch, which needs the array crate
# directly. Already an optional dependency, so this adds no build cost.
arrow-array.workspace = true
# Used by the `arrow` bench only, to measure a SQLite aggregate function against
# the ordinary row loop. Already a normal dependency, so this adds no build cost.
rusqlite.workspace = true
wkb.workspace = true
geo-types.workspace = true
# Also used by the Arrow schema test, to inspect the PROJJSON in the geometry
# field's metadata.
serde_json.workspace = true
hegeltest = "0.28.2"
criterion = "0.8"

[[bench]]
name = "write"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "tiles"
harness = false

[[bench]]
name = "handles"
harness = false

[[bench]]
name = "arrow"
harness = false
required-features = ["arrow"]

# Uses the Arrow data plane, so it cannot build without it. The bench above
# already declares this; without it here, `cargo nextest r -p geopackage`
# fails to build the example.
[[example]]
name = "arrow_bench"
required-features = ["arrow"]

# Times both the scalar and the columnar paths over a real file, so it needs
# the Arrow data plane for the same reason `arrow_bench` does.
[[example]]
name = "dataset_bench"
required-features = ["arrow"]

[[bench]]
name = "filtered"
harness = false
required-features = ["arrow"]
