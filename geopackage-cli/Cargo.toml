[package]
name = "geopackage-cli"
description = "Command-line tool for OGC GeoPackage (.gpkg) files: inspect, validate, index and copy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The binary is `gpkg`; the crate is `geopackage-cli` so it sits beside
# `geopackage` and `geopackage-core` on crates.io under the same name stem.
[[bin]]
name = "gpkg"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
geopackage.workspace = true
clap.workspace = true
thiserror.workspace = true

# The opposite default from the library: a binary is judged by whether
# `cargo install geopackage-cli` produces a working tool on a bare host, so
# it vendors SQLite unless told otherwise. System-linked builds (distro
# packaging) pass `--no-default-features`. Note the workspace consequence:
# feature unification means any whole-workspace build inherits `bundled`
# through this default, so the system-linked CI leg excludes this crate.
[features]
default = ["bundled"]
## Forward `geopackage`'s `bundled` feature: compile and statically link the
## vendored SQLite amalgamation instead of linking the system library.
bundled = ["geopackage/bundled"]

[dev-dependencies]
tempfile.workspace = true
# Integration tests damage a copy of a fixture through raw SQL to produce the
# conditions `validate` reports; nothing in the binary uses rusqlite directly.
rusqlite.workspace = true
