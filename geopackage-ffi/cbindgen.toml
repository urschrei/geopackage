language = "C"
header = """/* Generated by cbindgen from geopackage-ffi. Do not edit by hand.
 *
 * Regenerate with:
 *     cbindgen --config geopackage-ffi/cbindgen.toml \\
 *              --crate geopackage-ffi \\
 *              --output geopackage-ffi/include/geopackage.h
 *
 * CI regenerates it and fails if the result differs from what is committed, so
 * an ABI change cannot land without showing up as a diff in this file.
 */"""
include_guard = "GEOPACKAGE_H"
# The Arrow C Data Interface structs, verbatim from the Arrow specification and
# behind the guards the specification names. A consumer that already has them,
# from arrow's own abi.h or from another Arrow-exporting library, keeps its own
# definitions and these compile away.
after_includes = """
#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

#define ARROW_FLAG_DICTIONARY_ORDERED 1
#define ARROW_FLAG_NULLABLE 2
#define ARROW_FLAG_MAP_KEYS_SORTED 4

struct ArrowSchema {
  const char *format;
  const char *name;
  const char *metadata;
  int64_t flags;
  int64_t n_children;
  struct ArrowSchema **children;
  struct ArrowSchema *dictionary;
  void (*release)(struct ArrowSchema *);
  void *private_data;
};

struct ArrowArray {
  int64_t length;
  int64_t null_count;
  int64_t offset;
  int64_t n_buffers;
  int64_t n_children;
  const void **buffers;
  struct ArrowArray **children;
  struct ArrowArray *dictionary;
  void (*release)(struct ArrowArray *);
  void *private_data;
};

#endif  /* ARROW_C_DATA_INTERFACE */

#ifndef ARROW_C_STREAM_INTERFACE
#define ARROW_C_STREAM_INTERFACE

struct ArrowArrayStream {
  int (*get_schema)(struct ArrowArrayStream *, struct ArrowSchema *out);
  int (*get_next)(struct ArrowArrayStream *, struct ArrowArray *out);
  const char *(*get_last_error)(struct ArrowArrayStream *);
  void (*release)(struct ArrowArrayStream *);
  void *private_data;
};

#endif  /* ARROW_C_STREAM_INTERFACE */
"""
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[export]
prefix = ""
# The public C surface. Everything else in the crate is an implementation
# detail, and listing the roots explicitly keeps a new `pub` item from silently
# widening the ABI.
include = ["gpkg_error_t", "Status", "Container", "LayerHandle"]

[export.rename]
# The Rust names on the left are internal; C sees only these. `gpkg_status`
# carries no `_t` so its constants read `GPKG_STATUS_OK` rather than
# `GPKG_STATUS_T_OK`, which is what `prefix_with_name` would otherwise produce.
"Status" = "gpkg_status"
"Container" = "gpkg_t"
"LayerHandle" = "gpkg_layer_t"
# Declared in `after_includes` above, from the Arrow specification, rather than
# generated: cbindgen cannot see into arrow-rs with `parse_deps = false`, and
# the spec's own name is what a C consumer expects to link against.
"FFI_ArrowArrayStream" = "struct ArrowArrayStream"
"FFI_ArrowSchema" = "struct ArrowSchema"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
