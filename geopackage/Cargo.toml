[package]
name = "geopackage"
description = "Read and write OGC GeoPackage (.gpkg) files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The `arrow` module is behind an off-by-default feature. Without this, docs.rs
# would build the default feature set only, so the columnar API would be absent
# from the published documentation and the crate root's links into it would
# render as plain text.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
epsg-utils.workspace = true
geopackage-core.workspace = true
hotpath.workspace = true
geo-traits.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

[features]
default = ["geo-types"]
## Forward `geopackage-core`'s `geo-types` feature, enabling
## `GpbGeometry::to_geo` conversions. On by default; opt out with
## `default-features = false`.
geo-types = ["geopackage-core/geo-types"]
## Columnar read and write through Apache Arrow, with geometry as a
## GeoArrow WKB column. Off by default: it pulls the `arrow-array` and
## `arrow-schema` crates, which a caller using only the scalar API does not
## need.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:serde_json", "dep:sysinfo"]
## Decode the samples of tiled gridded coverage tiles: point lookups
## (`Coverage::value_at`), per-tile statistics, and the Requirement 21 check
## that a header read cannot make. Forwards `geopackage-core`'s feature of the
## same name, which holds the decode. Off by default: it pulls the `tiff` and
## `png` decoders, which a caller that reads coverages as bytes does not need.
coverage-samples = ["geopackage-core/coverage-samples"]
## Compile and statically link the vendored SQLite amalgamation instead of
## linking the system library. Off by default; the default build needs the
## system SQLite development files and an `SQLITE_ENABLE_RTREE` build, which
## is checked at open time. Required on hosts with no system SQLite (Windows),
## and needs a C compiler.
## Set `LIBSQLITE3_FLAGS` as the crate documentation describes under
## "Cargo features", or threaded reads wait on a shared page-cache mutex.
bundled = ["rusqlite/bundled"]
## Activate the hotpath timing instrumentation in this crate and in
## `geopackage-core`. Off by default: without it, every hotpath macro is a
## noop.
hotpath = ["hotpath/hotpath", "geopackage-core/hotpath"]
## Track allocations per instrumented function as well as timings. Use
## together with `hotpath`.
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dev-dependencies]
tempfile.workspace = true
# The Arrow tests build batches with the array crate directly. Already an
# optional dependency, so this adds no build cost.
arrow-array.workspace = true
# Used by the `arrow` bench only, to measure a SQLite aggregate function against
# the ordinary row loop. Already a normal dependency, so this adds no build cost.
rusqlite.workspace = true
wkb.workspace = true
geo-types.workspace = true
# Also used by the Arrow schema test, to inspect the PROJJSON in the geometry
# field's metadata.
serde_json.workspace = true
# The sample tests encode their own payloads, so that a decode is checked
# against an encoder other than the one under test. Already optional
# dependencies of `geopackage-core`, so this adds no build cost.
png.workspace = true
tiff.workspace = true
hegeltest = "0.49.11"
criterion = "0.8"
# Drives the `alloc` bench. Pinned: the benchmark macros it exports are not
# stable across minor versions. Needs Valgrind at run time, which does not
# exist for macOS on arm64, so the bench builds everywhere but runs on Linux.
gungraun = "=0.19.2"

[[test]]
name = "coverage_samples"
required-features = ["coverage-samples"]

[[bench]]
name = "write"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "tiles"
harness = false

[[bench]]
name = "envelope"
harness = false

[[bench]]
name = "handles"
harness = false

[[bench]]
name = "arrow"
harness = false
required-features = ["arrow"]

[[bench]]
name = "alloc"
harness = false

# Times both the scalar and the columnar paths, so it cannot build without the
# Arrow data plane. Without this, `cargo nextest r -p geopackage` fails to build
# the example.
[[example]]
name = "dataset_bench"
required-features = ["arrow"]

[[bench]]
name = "filtered"
harness = false
required-features = ["arrow"]
