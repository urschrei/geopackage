[workspace]
members = ["geopackage-core", "geopackage"]
exclude = ["geopackage-core/fuzz"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
# 1.95 is forced by libsqlite3-sys 0.38 (via rusqlite 0.40), whose build
# script uses cfg_select!, stabilised in 1.95. Revisit lowering once upstream
# gates it or declares an accurate rust-version.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# The repo has not been transferred to the georust org yet (roadmap 02-ecosystem,
# issue #18). Point at the live URL so the crates.io/docs.rs links resolve;
# GitHub keeps a redirect from the old path after a transfer, so this stays
# correct once the move happens.
repository = "https://github.com/urschrei/geopackage"
readme = "README.md"
authors = ["The GeoRust developers"]
keywords = ["geopackage", "gpkg", "gis", "geospatial", "ogc"]
categories = ["science::geo", "database"]

[workspace.dependencies]
geopackage-core = { version = "0.5.0", path = "geopackage-core", default-features = false }
thiserror = "2"
# `limits` is for SQLITE_LIMIT_FUNCTION_ARG: the Arrow read path passes one
# function argument per column, so it has to know when a table is too wide.
rusqlite = { version = "0.40", features = ["bundled", "functions", "limits"] }
tempfile = "3"
wkb = "0.9"
geo-traits = "0.3"
geo-types = "0.7"
# Calendar arithmetic and validation for the DATE/DATETIME types (issue #24).
# No timezone database: a GeoPackage DATETIME is UTC by definition, and this
# workspace transforms neither coordinates nor times, so `tz-*` and `tzdb-*` are
# all off. `std` alone is the whole of what is needed.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# EPSG definitions beyond the vendored WKT1 subset (issue #23): WKT2 for the
# gpkg_crs_wkt_1_1 extension column, and PROJJSON for GeoArrow's CRS metadata,
# which is the form that spec recommends. Its data is flate2-compressed, so it
# costs about 1.1 MB against crs-definitions' 4.3 MB for WKT1 alone, and it
# covers the geographic 3D codes WKT1 cannot express. MIT, and by the
# rusqlite-gpkg author, which is the coordination 02-ecosystem asks for.
epsg-utils = "0.0.3"
# Tile payload probing: the format a tile's magic bytes declare, and the pixel
# dimensions its header gives, so a written tile can be checked against the
# `tile_width`/`tile_height` of its zoom level. Reads a header, never an image,
# and has no dependencies of its own. No `imagesize` type appears in this
# workspace's API (the probe returns our own `TileFormat`), so a version bump
# there is not a breaking change here, on the same principle as `jiff`.
imagesize = "0.15"
serde_json = "1"
# Total system memory, for the Arrow read path's default batch byte ceiling.
# Only the `system` feature: the default set also probes disks, networks,
# components and users, none of which we ask anything about.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# M3 Arrow data plane. `arrow-array`/`arrow-schema` only: the GeoArrow WKB
# encoding is a Binary field carrying extension metadata, so `geoarrow-array`
# would add a dependency without adding capability. Revisit if native GeoArrow
# coordinate encodings land (roadmap 05-m3).
arrow-array = "59"
arrow-schema = "59"

# Inherited by every member via `[lints] workspace = true`. The planned
# `geopackage-ffi` crate (M3) is the sole intended exception: it will not
# inherit these lints, confining `unsafe` to the C ABI boundary.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Strict clippy set, after
# https://emschwartz.me/your-clippy-config-should-be-stricter/: all "warn"
# locally, promoted to errors by CI's `-D warnings`. Test code is exempted
# from the panic-family lints via clippy.toml. Deliberately omitted from the
# article's list: `expect_used` (justified `expect` messages are house
# style), `arithmetic_side_effects` (~85% noise by the author's own
# measurement), and the optional cast trio (`cast_possible_wrap`,
# `cast_precision_loss`, `cast_possible_truncation`, since the read path widens
# integers to f64 deliberately and documents it).
[workspace.lints.clippy]
# Don't panic.
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
unchecked_time_subtraction = "warn"
# Don't fail silently.
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
# Async hazards (no async here yet; guards the future).
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"
# Unsafe hygiene (moot under forbid(unsafe_code); binds the future ffi crate
# if it ever opts into the workspace table).
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
# Numeric.
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Easy-to-avoid issues.
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
dbg_macro = "warn"
# Suppression hygiene: #[expect(..., reason = "...")] only.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
