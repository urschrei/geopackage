name: qgis-plugin

# Builds the geopackage-rs abi3 wheel for each platform QGIS ships on, and the
# native data provider for each platform and QGIS 4 minor version, packs them
# into one QGIS plugin zip, and attaches the zip and the wheels to the GitHub
# release. Triggered as `release.yml` is: on a published
# release, by hand with a tag, or by a pull request that changes this file,
# which builds and packages everything and uploads nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach the plugin to, such as v0.14.0
        required: true
  pull_request:
    paths:
      - ".github/workflows/qgis-plugin.yml"
      - "scripts/package_qgis_plugin.py"
      - "geopackage-qgis/**"

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 (glibc 2.17), so the module loads into the QGIS of
          # any distribution still supported.
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          # One universal2 build, since `native.py` picks macOS modules by OS
          # alone: QGIS's macOS installers are arm64 and x86_64.
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release -m geopackage-py/Cargo.toml -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # The native provider, for each QGIS 4 minor version the plugin supports
  # natively. Each build needs QGIS's headers only (on Windows, its import
  # library too), made from the release's source tag, and Qt 6.6's headers,
  # the oldest Qt QGIS 4 supports, so that a build loads into any newer Qt.
  # Linux builds in a manylinux_2_28 container, whose toolchain links newer
  # C++ runtime parts statically, so the library loads into the QGIS of any
  # distribution with glibc 2.28 or later. Windows has 4.2 only: its import
  # library comes from conda-forge, which has no QGIS 4.0.
  native:
    strategy:
      fail-fast: false
      matrix:
        qgis: ["4.0.2", "4.2.3"]
        platform: [linux-x86_64, linux-aarch64, macos-universal2, windows-x86_64]
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            library: libgeopackage_qgis.so
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            library: libgeopackage_qgis.so
          - platform: macos-universal2
            os: macos-latest
            library: libgeopackage_qgis.dylib
          - platform: windows-x86_64
            os: windows-latest
            library: geopackage_qgis.dll
        exclude:
          - platform: windows-x86_64
            qgis: "4.0.2"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: qt
          channels: conda-forge
          conda-remove-defaults: "true"
          python-version: "3.12"
      - name: Qt 6.6 headers (and on Windows, QGIS's import library)
        run: |
          conda install -y "qt6-main=6.6"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "QT_DIR=$CONDA_PREFIX/Library" >> "$GITHUB_ENV"
            conda create -y -n qgis --no-deps "qgis=${{ matrix.qgis }}"
            echo "QGIS_LIB_DIR=$(conda info --base)/envs/qgis/Library/lib" >> "$GITHUB_ENV"
          else
            echo "QT_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          fi
      - name: QGIS headers from the release's source
        run: |
          tag="final-$(echo "${{ matrix.qgis }}" | tr . _)"
          git clone --quiet --depth 1 --branch "$tag" --filter=blob:none --sparse https://github.com/qgis/QGIS qgis-src
          git -C qgis-src sparse-checkout set src/core cmake_templates external/nlohmann
          python geopackage-qgis/scripts/qgis_headers.py qgis-src qgis-include
          echo "QGIS_INCLUDE_DIR=$PWD/qgis-include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Build
        run: |
          cd geopackage-qgis
          version="qgis-$(echo "${{ matrix.qgis }}" | cut -d. -f1-2)"
          out="../native/${{ matrix.platform }}/$version"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            lipo -create -output "$out/${{ matrix.library }}" \
              target/aarch64-apple-darwin/release/${{ matrix.library }} \
              target/x86_64-apple-darwin/release/${{ matrix.library }}
          else
            cargo build --release
            cp "target/release/${{ matrix.library }}" "$out/"
          fi
          ls -l "$out"
      # The newest glibc and C++ runtime symbol versions the Linux build
      # needs: what a distribution's QGIS must have.
      - if: runner.os == 'Linux'
        run: |
          lib=$(ls native/*/qgis-*/${{ matrix.library }})
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1
          ! objdump -p "$lib" | grep -E 'NEEDED.*(qgis|Qt6)'
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-qgis-${{ matrix.qgis }}
          path: native

  package:
    needs: [wheels, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - run: python3 scripts/package_qgis_plugin.py dist/*.whl --native native --out plugin
      - uses: actions/upload-artifact@v7
        with:
          name: qgis-plugin
          path: plugin/*.zip
      - if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" plugin/*.zip dist/*.whl --clobber
