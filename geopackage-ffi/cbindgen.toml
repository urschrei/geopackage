language = "C"
header = """/* Generated by cbindgen from geopackage-ffi. Do not edit by hand.
 *
 * Regenerate with:
 *     cbindgen --config geopackage-ffi/cbindgen.toml \\
 *              --crate geopackage-ffi \\
 *              --output geopackage-ffi/include/geopackage.h
 *
 * CI regenerates it and fails if the result differs from what is committed, so
 * an ABI change cannot land without showing up as a diff in this file.
 */"""
include_guard = "GEOPACKAGE_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[export]
prefix = ""
# The public C surface. Everything else in the crate is an implementation
# detail, and listing the roots explicitly keeps a new `pub` item from silently
# widening the ABI.
include = ["gpkg_error_t", "Status", "Container", "LayerHandle"]

[export.rename]
# The Rust names on the left are internal; C sees only these. `gpkg_status`
# carries no `_t` so its constants read `GPKG_STATUS_OK` rather than
# `GPKG_STATUS_T_OK`, which is what `prefix_with_name` would otherwise produce.
"Status" = "gpkg_status"
"Container" = "gpkg_t"
"LayerHandle" = "gpkg_layer_t"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
