name: qgis-plugin

# Builds the geopackage-rs abi3 wheel for each platform QGIS ships on, and the
# native data provider for each platform and QGIS 4 minor version, packs them
# into one QGIS plugin zip, and attaches the zip and the wheels to the GitHub
# release. The plugin has releases of its own, tagged `qgis-plugin-vX.Y.Z`,
# separate from the crates' `vX.Y.Z`. Triggered on a published plugin
# release, by hand with a plugin tag, or by a pull request that changes this
# file, which builds and packages everything and uploads nothing. A crate
# release does not run it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The plugin release tag to build and attach the plugin to, such as qgis-plugin-v0.15.0
        required: true
  pull_request:
    paths:
      - ".github/workflows/qgis-plugin.yml"
      - "scripts/package_qgis_plugin.py"
      - "scripts/host_sqlite.py"
      - "geopackage-qgis/**"

# A newer commit on a pull request cancels the run for the older one. Other
# runs, such as pushes to main and release builds, each have a group of
# their own, so none of them is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # The other jobs need this one, so a crate release skips them all.
  tag:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'qgis-plugin-v') }}
    runs-on: ubuntu-latest
    steps:
      - if: env.TAG != '' && !startsWith(env.TAG, 'qgis-plugin-v')
        run: |
          echo "$TAG is not a plugin release tag (qgis-plugin-vX.Y.Z)"
          exit 1

  wheels:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (glibc 2.28), as for the native provider, so the
          # module loads into the QGIS of any distribution still supported.
          # On Linux and macOS the module links QGIS's SQLite rather than a
          # copy of its own (scripts/host_sqlite.py), so the wheel is not
          # repaired, which would put a copy of the build host's in it.
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            args: --no-default-features --auditwheel skip
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            args: --no-default-features --auditwheel skip
          # One universal2 build, since `native.py` picks macOS modules by OS
          # alone: QGIS's macOS installers are arm64 and x86_64.
          - os: macos-latest
            target: universal2-apple-darwin
            args: --no-default-features --auditwheel skip
          # Windows keeps a lock for each file handle, so there the module
          # keeps its own SQLite.
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - if: runner.os == 'macOS'
        run: python3 scripts/host_sqlite.py --github-env
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # The system's SQLite, whose soname is libsqlite3.so.0: the linker
          # otherwise found a libsqlite3.so without a soname first.
          before-script-linux: dnf install -y sqlite-devel && export SQLITE3_LIB_DIR=/usr/lib64
          args: --release -m geopackage-py/Cargo.toml -o dist ${{ matrix.args }}
      - if: runner.os != 'Windows'
        run: python3 scripts/host_sqlite.py --check dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # The native provider, for each QGIS 4 minor version the plugin supports
  # natively. Each build needs QGIS's headers only (on Windows, its import
  # library too), made from the release's source tag, and Qt 6.6's headers,
  # the oldest Qt QGIS 4 supports, so that a build loads into any newer Qt.
  # Linux builds in a manylinux_2_28 container, whose toolchain links newer
  # C++ runtime parts statically, so the library loads into the QGIS of any
  # distribution with glibc 2.28 or later. On Windows the import library,
  # qgis_core.lib, comes from OSGeo4W's qgis-devel package for the same
  # release: OSGeo4W also builds QGIS's Windows installers.
  native:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        qgis: ["4.0.2", "4.2.3"]
        platform: [linux-x86_64, linux-aarch64, macos-universal2, windows-x86_64]
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            library: libgeopackage_qgis.so
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            library: libgeopackage_qgis.so
          - platform: macos-universal2
            os: macos-latest
            library: libgeopackage_qgis.dylib
          - platform: windows-x86_64
            os: windows-latest
            library: geopackage_qgis.dll
          # OSGeo4W's qgis-devel archive for each release, and its SHA-256.
          - qgis: "4.0.2"
            osgeo4w: qgis-devel-4.0.2-2.tar.bz2
            osgeo4w_sha256: 74067c1208d3614a31a8d01ff5b8f2fe9d537566562332a754c298903b9f304e
          - qgis: "4.2.3"
            osgeo4w: qgis-devel-4.2.3-1.tar.bz2
            osgeo4w_sha256: 7e3c659f39720c1c9862521bdc863bf364e6aee70406d56a43d3d871e72ad6ed
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: qt
          channels: conda-forge
          conda-remove-defaults: "true"
          python-version: "3.12"
      - name: Qt 6.6 headers (and on Windows, QGIS's import library)
        run: |
          conda install -y "qt6-main=6.6"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "QT_DIR=$CONDA_PREFIX/Library" >> "$GITHUB_ENV"
            curl -fsSL -o qgis-devel.tar.bz2 \
              "https://download.osgeo.org/osgeo4w/v2/x86_64/release/qgis/qgis/qgis-devel/${{ matrix.osgeo4w }}"
            echo "${{ matrix.osgeo4w_sha256 }}  qgis-devel.tar.bz2" | sha256sum -c -
            tar xjf qgis-devel.tar.bz2 apps/qgis/lib/qgis_core.lib
            echo "QGIS_LIB_DIR=$(cygpath -m "$PWD/apps/qgis/lib")" >> "$GITHUB_ENV"
          else
            echo "QT_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          fi
      - name: QGIS headers from the release's source
        run: |
          tag="final-$(echo "${{ matrix.qgis }}" | tr . _)"
          git clone --quiet --depth 1 --branch "$tag" --filter=blob:none --sparse https://github.com/qgis/QGIS qgis-src
          git -C qgis-src sparse-checkout set src/core cmake_templates external/nlohmann
          python geopackage-qgis/scripts/qgis_headers.py qgis-src qgis-include
          echo "QGIS_INCLUDE_DIR=$PWD/qgis-include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # QGIS's SQLite: on Linux, the system's development files, to link
      # `libsqlite3.so.0` against (the linker otherwise found a libsqlite3.so
      # without a soname first); on macOS, the settings that link QGIS.app's.
      - if: runner.os == 'Linux'
        run: |
          dnf install -y sqlite-devel
          echo "SQLITE3_LIB_DIR=/usr/lib64" >> "$GITHUB_ENV"
      - run: python scripts/host_sqlite.py --github-env
      - name: Build
        run: |
          cd geopackage-qgis
          version="qgis-$(echo "${{ matrix.qgis }}" | cut -d. -f1-2)"
          out="../native/${{ matrix.platform }}/$version"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            lipo -create -output "$out/${{ matrix.library }}" \
              target/aarch64-apple-darwin/release/${{ matrix.library }} \
              target/x86_64-apple-darwin/release/${{ matrix.library }}
          else
            cargo build --release
            cp "target/release/${{ matrix.library }}" "$out/"
          fi
          ls -l "$out"
      # The newest glibc and C++ runtime symbol versions the Linux build
      # needs: what a distribution's QGIS must have.
      - if: runner.os == 'Linux'
        run: |
          lib=$(ls native/*/qgis-*/${{ matrix.library }})
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1
          ! objdump -p "$lib" | grep -E 'NEEDED.*(qgis|Qt6)'
      - if: runner.os != 'Windows'
        run: python scripts/host_sqlite.py --check native/*/qgis-*/${{ matrix.library }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-qgis-${{ matrix.qgis }}
          path: native

  package:
    needs: [wheels, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - run: python3 scripts/package_qgis_plugin.py dist/*.whl --native native --out plugin ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@v7
        with:
          name: qgis-plugin
          path: plugin/*.zip
      - if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" plugin/*.zip dist/*.whl --clobber
