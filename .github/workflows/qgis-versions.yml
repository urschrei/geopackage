name: qgis-versions

# Once a month, compares the QGIS 4 minor versions that qgis-plugin.yml builds
# the native provider for with QGIS's releases, and opens an issue for each
# newer minor version, with what its matrix entry needs
# (scripts/qgis_versions.py). Until the matrix has the entry, the plugin uses
# its Python provider in that QGIS.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: |
          python3 scripts/qgis_versions.py --body body.md | tee out.txt
          grep -E '^(minors|new)=' out.txt >> "$GITHUB_OUTPUT"
      - if: steps.versions.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Native provider: no build for QGIS ${{ steps.versions.outputs.minors }}"
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json title \
            --jq "map(select(.title == env.TITLE)) | length")
          if [ "$open" -gt 0 ]; then
            echo "An open issue already has the title: $TITLE"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
